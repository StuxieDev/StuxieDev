# GitHub Action for generating a devcard
name: Generate Devcards

# Controls when the action will run. This action runs every 24 hours at midnight.
on:
  # This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:
  # Push to main branch
  push:
    branches:
      - main
  # Run every day
  schedule:
    - cron: "0 0 * * *"

# The sequence of runs in this workflow:
jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure devcard branch exists
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/devcard" --silent 2>/dev/null || \
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            --method POST \
            -f ref="refs/heads/devcard" \
            -f sha="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" --jq '.object.sha')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This workflow contains a job called "devcard"
  devcard:
    needs: setup
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Give permission to write
    permissions:
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Generates the devcard
      - uses: dailydotdev/action-devcard@3.2.0
        with:
          user_id: ${{ secrets.USER_ID }}
          commit_branch: devcard
          commit_filename: devcard.png
          commit_message: "build: update `devcard`"
  # This workflow contains a job called "devcard-dark"
  devcard-dark:
    needs: setup
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Give permission to write
    permissions:
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Generates the devcard
      - uses: dailydotdev/action-devcard@3.2.0
        with:
          user_id: ${{ secrets.USER_ID }}
          commit_branch: devcard
          commit_filename: devcard-dark.png
          commit_message: "build: update `devcard-dark`"
