name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Key files exist
        run: |
          set -euo pipefail
          for f in README.md CHANGELOG.md VERSION.md CONTRIBUTING.md commit.sh commit.bat; do
            if [ ! -f "$f" ]; then echo "::error::Missing $f"; exit 1; fi
          done
      - name: Workflow YAML is valid
        run: |
          set -euo pipefail
          for f in .github/workflows/*.yml; do yq e 'true' "$f" > /dev/null && echo "ok $f"; done

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same checks as a local release: a valid, real, non-future Date Version that leads CHANGELOG.md.
      - name: VERSION.md is a valid Date Version and leads CHANGELOG.md
        run: bash tests/version.sh
