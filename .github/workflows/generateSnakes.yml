# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate Snakes

# Controls when the action will run. This action runs every 24 hours at midnight.
on:
  # This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:
  # Push to main branch
  push:
    branches:
      - main
  # Run every day
  schedule:
    - cron: "0 0 * * *"

# The sequence of runs in this workflow:
jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure snake branch exists
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/snake" --silent 2>/dev/null || \
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            --method POST \
            -f ref="refs/heads/snake" \
            -f sha="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" --jq '.object.sha')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This workflow contains a single job called "snake"
  snake:
    needs: setup
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Give it permissions to write
    permissions:
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks repo under $GITHUB_WORKSHOP, so your job can access it
      - uses: actions/checkout@v4
      # Generates the snake  
      - uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: StuxieDev
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # show the status of the build. Makes it easier for debugging (if there's any issues).
      - run: git status
      - uses: crazy-max/ghaction-github-pages@v4.1.0
        with:
          target_branch: snake
          build_dir: dist
          commit_message: "build: update `snake`"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
