# GitHub Action for generating a metrics
name: Generate Metrics

# Controls when the action will run. This action runs every 24 hours at midnight.
on:
  # This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:
  # Push to main branch
  push:
    branches:
      - main
  # Run every day
  schedule:
    - cron: "0 0 * * *"

# The sequence of runs in this workflow:
jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Ensure metrics branch exists
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/metrics" --silent 2>/dev/null || \
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            --method POST \
            -f ref="refs/heads/metrics" \
            -f sha="$(gh api "repos/$GITHUB_REPOSITORY/git/refs/heads/main" --jq '.object.sha')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This workflow contains a job called "stats"
  stats:
    needs: setup
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Generates the metrics
      - uses: gh-metrics/metrics@727b269a0e1af233e88b535a7555bb736e54b4b2
        with:
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          committer_message: "build: update `stats`"

          # Options
          user: StuxieDev
          template: classic
          base: header, activity, community
          config_timezone: Europe/London
          config_output: svg
          config_padding: 25%, 30
          filename: stats.svg

  # This workflow contains a job called "notable_simple"
  notable_simple:
    needs: setup
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Generates the metrics
      - uses: gh-metrics/metrics@727b269a0e1af233e88b535a7555bb736e54b4b2
        with:
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          committer_message: "build: update `notable_simple`"

          # Options
          user: StuxieDev
          template: classic
          base: ""
          config_display: large
          config_timezone: Europe/London
          config_output: svg
          config_padding: 0, 30
          filename: notable_simple.svg

          # Notable contributions
          plugin_notable: yes
          plugin_notable_filter: stars:>25

  # This workflow contains a job called "notable_indepth"
  notable_indepth:
    needs: setup
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Generates the metrics
      - uses: gh-metrics/metrics@727b269a0e1af233e88b535a7555bb736e54b4b2
        with:
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          committer_message: "build: update `notable_indepth`"

          # Options
          user: StuxieDev
          template: classic
          base: ""
          config_display: large
          config_timezone: Europe/London
          config_output: svg
          config_padding: 0, 30
          filename: notable_indepth.svg

          # Notable contributions
          plugin_notable: yes
          plugin_notable_filter: stars:>25
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
          plugin_notable_from: all

  # This workflow contains a job called "achievements"
  achievements:
    needs: setup
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Generates the metrics
      - uses: gh-metrics/metrics@727b269a0e1af233e88b535a7555bb736e54b4b2
        with:
          # You'll need to setup a personal token in your secrets.
          token: ${{ secrets.METRICS_TOKEN }}
          # GITHUB_TOKEN is a special auto-generated token used for commits
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: metrics
          committer_message: "build: update `achievements`"

          # Options
          user: StuxieDev
          template: classic
          base: ""
          config_display: large
          config_timezone: Europe/London
          config_output: svg
          filename: achievements.svg
          repositories_batch: 5

          # Achievement plugin
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
